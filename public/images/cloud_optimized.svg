<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <!-- Filter to create the organic, puffy texture -->
    <filter id="cloud-texture" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Generate fractal noise for the fine details -->
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="6" seed="42" result="noise" />
      
      <!-- Use the noise to warp the edges of the base shapes -->
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="90" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      
      <!-- Soften the result for a misty look -->
      <feGaussianBlur in="displaced" stdDeviation="4" result="blurred" />
      
      <!-- Adjust contrast to make it pop against the black background -->
      <feComponentTransfer in="blurred">
        <feFuncA type="linear" slope="1.4" intercept="-0.1" />
      </feComponentTransfer>
    </filter>

    <!-- Radial gradient for internal depth and lighting -->
    <radialGradient id="cloud-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.9" />
      <stop offset="70%" stop-color="white" stop-opacity="0.4" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="black" />

  <!-- Cloud Construction: Multiple overlapping shapes to build mass -->
  <g filter="url(#cloud-texture)">
    <!-- Main central mass -->
    <circle cx="256" cy="240" r="110" fill="url(#cloud-glow)" />
    
    <!-- Secondary puffs to define the silhouette -->
    <circle cx="180" cy="200" r="70" fill="url(#cloud-glow)" opacity="0.8" />
    <circle cx="340" cy="220" r="80" fill="url(#cloud-glow)" opacity="0.85" />
    <circle cx="280" cy="340" r="90" fill="url(#cloud-glow)" opacity="0.75" />
    <circle cx="170" cy="310" r="65" fill="url(#cloud-glow)" opacity="0.7" />
    <circle cx="360" cy="320" r="60" fill="url(#cloud-glow)" opacity="0.6" />
    <circle cx="256" cy="150" r="75" fill="url(#cloud-glow)" opacity="0.8" />
  </g>
</svg>